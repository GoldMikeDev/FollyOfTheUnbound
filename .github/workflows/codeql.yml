name: "CodeQL"

# Advanced setup: runs an actual build instead of relying on CodeQL's default
# autobuild, which doesn't understand this repo's SDK bootstrapping / restore
# script and ends up compiling little of the codebase (reported as "Low C#
# analysis quality"). Building FollyOfTheUnbound.slnx gives CodeQL real
# compiled output across the compiler, IDE, and Razor layers in one pass.
#
# Deliberately not Roslyn.slnx (the true full solution): most of
# src/RoslynAnalyzers is Roslyn's own dogfooding lint tooling, built against
# an older released Microsoft.CodeAnalysis reference, and breaks whenever
# this fork adds a new SyntaxKind -- see the comment in
# FollyOfTheUnbound.slnx's /Analyzers/ folder. That filter already excludes
# the known-broken bulk while keeping the one analyzer-adjacent project other
# real projects depend on, so building it (rather than Roslyn.slnx, or adding
# RoslynAnalyzers projects by hand) is both broader-coverage and safe here.

on:
  push:
    branches: ["folly-of-the-unbound", "main"]
  pull_request:
    branches: ["folly-of-the-unbound", "main"]
  schedule:
    - cron: "30 4 * * 1" # 04:30 UTC every Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual

      - name: Restore
        env:
          CI: false # avoid GitInfo/CI-specific restore failures, matching copilot-setup-steps.yml
        run: ./restore.sh

      - name: Build (Compilers + IDE + Razor)
        run: dotnet build FollyOfTheUnbound.slnx

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
